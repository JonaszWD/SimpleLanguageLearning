[project]
name = "language-app"
version = "0.1.0"
description = "Offline-first language learning PWA: FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "trafilatura>=2.3.1",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "mutagen>=1.48.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
