# Publishes the app (frontend/) and the content packs (content/packs) as one static site on
# GitHub Pages: https://<user>.github.io/<repo>/. Free for public repositories.
# Pushing a frontend change redeploys; installed phones then update themselves.
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "content/**"
      - "backend/app/build.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          python3 backend/app/build.py frontend site   # copies the app + generates sw.js
          cp -r content/packs site/packs
          if [ -d content/articles ]; then cp -r content/articles site/articles; fi
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
