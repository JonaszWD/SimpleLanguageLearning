# Fetches fresh El Mundo articles a few times a day, adds a word glossary to each, commits them
# to content/articles and redeploys the site. The app syncs them from articles/index.json.
name: Refresh articles

on:
  schedule:
    - cron: "0 5,11,17 * * *"
  workflow_dispatch:

permissions:
  contents: write   # commit the new articles
  actions: write    # trigger the site deploy

concurrency:
  group: articles

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      # The offline dictionary is built once from Wiktionary data, then cached.
      - uses: actions/cache@v4
        id: dict
        with:
          path: backend/data/dict/es-en.sqlite
          key: dict-${{ hashFiles('backend/app/dictionary.py') }}
      - name: Build dictionary
        if: steps.dict.outputs.cache-hit != 'true'
        working-directory: backend
        run: |
          curl -sSL --retry 3 -o "$RUNNER_TEMP/kaikki.jsonl" https://kaikki.org/dictionary/Spanish/kaikki.org-dictionary-Spanish.jsonl
          uv run python -m app.dictionary build "$RUNNER_TEMP/kaikki.jsonl"

      - name: Fetch articles
        working-directory: backend
        env:
          ARTICLES_DIR: ${{ github.workspace }}/content/articles
        run: uv run python -m app.daily

      - name: Commit and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/articles
          if git diff --cached --quiet; then
            echo "No new articles."
          else
            git commit -m "Update articles"
            git push
            gh workflow run pages.yml   # pushes by GITHUB_TOKEN don't trigger workflows themselves
          fi
